name: Build and Test
permissions:
  contents: read

on:
  push:
    branches: [gh-pages]
  pull_request:
    branches: [gh-pages]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: true

    - name: Set up Ruby
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: 4.0.5
        bundler-cache: true

    - name: Run tests
      run: ./script/cibuild
