mit:
  description: |-
    著作権表示とライセンス表示の保持だけを条件とする、短くシンプルなパーミッシブライセンスです。ライセンスされた著作物、その改変物、およびそれを含むより大きな著作物は、異なる条件の下で、ソースコードなしで配布できます。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。[year] を現在の年に、[fullname] を著作権者の名前（複数可）に置き換えてください。

apache-2.0:
  description: |-
    著作権表示とライセンス表示の保持を主な条件とするパーミッシブライセンスです。コントリビューターは特許権を明示的に許諾します。ライセンスされた著作物、その改変物、およびそれを含むより大きな著作物は、異なる条件の下で、ソースコードなしで配布できます。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。
  note: |-
    Apache Software Foundation は、追加の手順として、各ソースファイルのヘッダーに定型の告知文を追加することを<a href="https://apache.org/foundation/license-faq.html#Apply-My-Software">推奨しています</a>。告知文はライセンス本文の末尾にある付録に記載されています。

gpl-3.0:
  description: |-
    この強いコピーレフトライセンスによる許可は、ライセンスされた著作物とその改変物（ライセンスされた著作物を利用するより大きな著作物を含む）の完全なソースコードを、同じライセンスの下で入手可能にすることを条件としています。著作権表示とライセンス表示は保持しなければなりません。コントリビューターは特許権を明示的に許諾します。
  how: |-
    ソースコードのルートにテキストファイル（GNU の慣例に従い、通常は COPYING という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。
  note: |-
    Free Software Foundation は、追加の手順として、各ファイルの先頭に定型の告知文を追加することを推奨しています。定型文はライセンスの末尾に記載されています。

agpl-3.0:
  description: |-
    この最も強いコピーレフトライセンスによる許可は、ライセンスされた著作物とその改変物（ライセンスされた著作物を利用するより大きな著作物を含む）の完全なソースコードを、同じライセンスの下で入手可能にすることを条件としています。著作権表示とライセンス表示は保持しなければなりません。コントリビューターは特許権を明示的に許諾します。改変版がネットワーク経由でサービスを提供するために使われる場合は、その改変版の完全なソースコードを入手可能にしなければなりません。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。
  note: |-
    Free Software Foundation は、追加の手順として、各ファイルの先頭に定型の告知文を追加することを推奨しています。定型文はライセンスの末尾に記載されています。

lgpl-3.0:
  description: |-
    このコピーレフトライセンスによる許可は、ライセンスされた著作物とその改変物の完全なソースコードを、同じライセンスまたは GNU GPLv3 の下で入手可能にすることを条件としています。著作権表示とライセンス表示は保持しなければなりません。コントリビューターは特許権を明示的に許諾します。ただし、ライセンスされた著作物が提供するインターフェースを通じてその著作物を利用するより大きな著作物は、異なる条件の下で、そのより大きな著作物のソースコードなしで配布できます。
  how: |-
    このライセンスは、<a href="/licenses/gpl-3.0">GNU GPLv3</a> ライセンスに追加の許可を加えるものです。ソースコードのルートで GNU GPLv3 を適用する手順に従ってください。そのうえで、COPYING.LESSER という名前のファイルを追加し、本文をコピーしてください。
  note: |-
    Free Software Foundation は、追加の手順として、各ファイルの先頭に定型の告知文を追加することを推奨しています。定型文は <a href="/licenses/gpl-3.0">GNU GPLv3 ライセンス</a>の末尾に記載されています。GNU GPLv3 ではなく GNU LGPLv3 を指すように、定型文中の 3 か所すべてで「General」の前に「Lesser」を挿入してください。

mpl-2.0:
  description: |-
    この弱いコピーレフトライセンスによる許可は、ライセンスされたファイルとそのファイルへの改変のソースコードを、同じライセンス（または特定の場合には GNU ライセンスのいずれか）の下で入手可能にすることを条件としています。著作権表示とライセンス表示は保持しなければなりません。コントリビューターは特許権を明示的に許諾します。ただし、ライセンスされた著作物を利用するより大きな著作物は、異なる条件の下で、そのより大きな著作物に追加されたファイルのソースコードなしで配布できます。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。
  note: |-
    Mozilla Foundation は、追加の手順として、各ファイルの先頭に定型の告知文を追加することを推奨しています。定型文はライセンスの末尾（Exhibit A）に記載されています。

bsl-1.0:
  description: |-
    ソース形式での配布（バイナリ形式は除く）の場合にのみ、著作権表示とライセンス表示の保持を求めるシンプルなパーミッシブライセンスです。ライセンスされた著作物、その改変物、およびそれを含むより大きな著作物は、異なる条件の下で、ソースコードなしで配布できます。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。
  note: |-
    Boost は、追加の手順として、各ファイルの先頭に定型の告知文を追加することを推奨しています。定型文は <a href="https://www.boost.org/users/license.html#FAQ">Boost Software License FAQ</a> に記載されています。

unlicense:
  description: |-
    いかなる条件も課さずに、著作物をパブリックドメインに提供するライセンスです。Unlicense が適用された著作物、その改変物、およびそれを含むより大きな著作物は、異なる条件の下で、ソースコードなしで配布できます。
  how: |-
    ソースコードのルートにテキストファイル（通常は UNLICENSE または UNLICENSE.txt という名前）を作成し、ライセンスの権利放棄文をそのファイルにコピーしてください。

# --- そのほかのライセンス（アルファベット順） ---------------------------------

0bsd:
  description: |-
    BSD Zero Clause License は BSD 2-Clause License をさらに推し進めたもので、ソース形式でもバイナリ形式でも著作権表示、ライセンス本文、免責事項を含める必要なく、ソフトウェアを無制限に自由に扱えるようにします。
