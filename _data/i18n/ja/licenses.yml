epl-2.0:
  description: |-
    この商用利用に配慮したコピーレフトライセンスは、バイナリを商用ライセンスで提供できること、現代的なロイヤリティフリーの特許ライセンスの許諾、そしてリンクされた著作物が商用ライセンスを含む他のライセンスを使用できることを特徴としています。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。

eupl-1.1:
  description: |-
    「European Union Public Licence」（EUPL）は、欧州委員会の主導で作成され、欧州連合の 22 の公用語で欧州委員会により承認された、コピーレフトのフリー／オープンソースソフトウェアライセンスです。
  how: |-
    ソースコードのルートにテキストファイル（通常は COPYING または LICENCE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。
  note: |-
    欧州委員会は、追加の手順として、各ファイルの先頭に<a href="https://joinup.ec.europa.eu/sites/default/files/inline-files/EUPL%201_1%20Guidelines%20EN%20Joinup.pdf#page=17">定型の告知文</a>を追加することを推奨しています。

eupl-1.2:
  description: |-
    European Union Public Licence（EUPL）は、欧州委員会の主導で作成され、欧州連合の <a href="https://joinup.ec.europa.eu/collection/eupl/eupl-text-eupl-12">23 の公用語</a>で欧州委員会により承認された、コピーレフトのフリー／オープンソースソフトウェアライセンスです。
  how: |-
    ソースコードの著作権表示に続けて「Licensed under the EUPL」と記載してください。たとえば README ファイルに記載するか、ソースコードファイルに直接コメントとして記載します。

gfdl-1.3:
  description: |-
    ソフトウェアのドキュメント向けのコピーレフトライセンスです。
  how: |-
    ソースコードのルートにテキストファイル（GNU の慣例に従い、通常は COPYING という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。
  note: |-
    Free Software Foundation は、追加の手順として、ライセンスされる文書のタイトルの後に定型の告知文を追加することを推奨しています。定型文はライセンスの「addendum」の部分に記載されています。

gpl-2.0:
  description: |-
    GNU GPL は最も広く使われているフリーソフトウェアライセンスで、強いコピーレフトの要件があります。派生著作物を配布する際は、その著作物のソースコードを同じライセンスの下で入手可能にしなければなりません。GNU GPL には複数の版があり、それぞれ要件が異なります。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。
  note: |-
    Free Software Foundation は、追加の手順として、各ファイルの先頭に定型の告知文を追加することを推奨しています。定型文はライセンスの末尾に記載されています。

isc:
  description: |-
    適切なクレジット表示を行い、保証なしであることを前提に、あなたのコードであらゆることを行えるようにするパーミッシブライセンスです。ISC License は、もはや不要となった文言の一部を取り除いたもので、機能的には <a href="/licenses/bsd-2-clause/">BSD 2-Clause</a> や <a href="/licenses/mit/">MIT</a> ライセンスと同等です。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。[year] を現在の年に、[fullname] を著作権者の名前（複数可）に置き換えてください。

lgpl-2.1:
  description: |-
    主にソフトウェアライブラリに使われる GNU LGPL は、派生著作物を同じライセンスの下でライセンスすることを求めますが、単にリンクするだけの著作物はこの制限の対象になりません。GNU LGPL には一般的に使われる 2 つのバージョンがあります。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。
  note: |-
    Free Software Foundation は、追加の手順として、各ファイルの先頭に定型の告知文を追加することを推奨しています。定型文はライセンスの末尾に記載されています。

lppl-1.3c:
  description: |-
    LaTeX Project Public License（LPPL）は、LaTeX カーネルと LaTeX の基本パッケージが配布される際の主要なライセンスです。
  how: |-
    著作物の各コンポーネントに、あなたの名前と、著作物が作成された年および／または最後に大幅に改変された年を含む明示的な著作権表示を記載してください。また、そのコンポーネントの配布および／または改変がこのライセンスの条件に従うことを示す文言も含めてください。
  note: |-
    定型文の例と、このライセンスの使い方に関する詳しい情報は、ライセンスの末尾に記載されています。

mit-0:
  description: |-
    条件がまったくなく、著作権表示やライセンス表示の保持さえ求めない、短くシンプルなパーミッシブライセンスです。ライセンスされた著作物、その改変物、およびそれを含むより大きな著作物は、異なる条件の下で、ソースコードなしで配布できます。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。[year] を現在の年に、[fullname] を著作権者の名前（複数可）に置き換えてください。

ms-pl:
  description: |-
    特許の許諾を含むオープンソースライセンスです。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。

ms-rl:
  description: |-
    <a href="/licenses/ms-pl/">Microsoft Public License</a> と同様に特許の許諾を含むオープンソースライセンスで、派生したファイルのソースコードはすべてこのライセンスの下で提供しなければならないという追加の条件があります。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。

mulanpsl-2.0:
  description: |-
    <a href="/licenses/apache-2.0/">Apache License</a> に似たパーミッシブライセンスですが、商標権を許諾しないことを明示しています。Mulan Permissive Software License は、OSI に承認された初の中国語と英語の両方によるオープンソースライセンスです。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。
  note: |-
    追加の手順として、各ファイルの先頭に定型の告知文を追加することが推奨されています。定型文はライセンスの末尾に記載されています。

ncsa:
  description: |-
    University of Illinois/NCSA Open Source License（UIUC ライセンスとも呼ばれます）は、<a href="/licenses/mit/">MIT/X11 ライセンス</a>と <a href="/licenses/bsd-3-clause/">BSD 3-Clause License</a> を基にしたパーミッシブなフリーソフトウェアライセンスです。ソース形式とバイナリ形式の両方の配布で著作権表示とライセンス表示を保持すること、および著作者やプロジェクト組織の名前を派生製品の宣伝や推奨に使うことの禁止を条件としています。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。[year] を現在の年に、[fullname] を著作権者の名前（複数可）に置き換えてください。この著作物を支援するプロジェクト組織がある場合は、[project] をその組織名に置き換えてください。

odbl-1.0:
  description: |-
    Open Database License（ODbL）は、他の人にも同じ自由を維持しながら、利用者がデータベースを自由に共有・改変・利用できるようにすることを目的としたライセンス契約です。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。

ofl-1.1:
  description: |-
    Open Font License（OFL）は SIL International が管理しています。フリーソフトウェアのコミュニティと書体デザインのコミュニティ、双方の価値観の折り合いをつけることを目指しています。Adobe、Google、Mozilla によるものを含め、ほぼすべてのオープンソースフォントプロジェクトで使われています。
  how: |-
    フォントのソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。[year] を現在の年に、[fullname] ([email]) を各著作権者の名前と連絡先メールアドレスに置き換えてください。追加の手順として、予約フォント名（Reserved Font Name）の告知を追記することもできます。このオプションを選ぶと、改変を行う人はフォントの名前を変更しなければならなくなるため、ウェブフォントには適していません（ウェブフォントは、利用者全員が形式の変換や用途に応じたサブセット化によって改変することになるためです）。
  note: |-
    このライセンスはソースの提供を義務づけてはいませんが、推奨しています。OFL のファイルから派生したファイルはすべて、引き続き OFL の下でライセンスされなければなりません。

osl-3.0:
  description: |-
    このコピーレフトライセンスによる許可は、ライセンスされた著作物とその改変物のソースコードを、同じライセンスの下で配布することを条件としています。著作権表示とライセンス表示は保持しなければなりません。コントリビューターは特許権を明示的に許諾します。著作物やその改変物を使って外部の利用者にサービスを提供することは配布とみなされ、その場合もソースコードを入手可能にする必要があります。ライセンスされた著作物に単にリンクするだけの著作物は集合著作物とみなされ、このライセンスの互恵性の要件の対象にはなりません。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。OSL 3.0 でライセンスされるファイルには、著作権表示に隣接して「Licensed under the Open Software License version 3.0」という告知も含める必要があります。
  note: |-
    OSL 3.0 の作成者が、このライセンスを作成した背景について<a href="https://rosenlaw.com/OSL3.0-explained.htm">説明を公開しています</a>。

postgresql:
  description: |-
    PostgreSQL 専用に使われている、非常に短い BSD スタイルのライセンスです。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。[year] を現在の年に、[fullname] を著作権者の名前（複数可）に置き換えてください。

upl-1.0:
  description: |-
    OSI と FSF に承認され、GPL と互換性のあるパーミッシブライセンスで、ライセンスの全文ではなく著作権表示と短いリンクだけでクレジット表示を行うことを明示的に認めています。特許権の明示的な許諾を含みます。ライセンスされた著作物とその改変物は、異なる条件の下で、ソースコードなしで配布できます。また、特許の許諾を任意でより大きな著作物にまで拡張し、コントリビューターライセンス契約として利用することもできます。
  how: |-
    ライセンスまたはそのリンクを著作権表示とともにソースファイルに挿入するか、ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成してライセンスの本文をそのファイルにコピーしてください（またはその両方）。その際、[year] を現在の年に、[fullname] を著作権者の名前（複数可）に置き換えてください。
  note: |-
    各ソースファイルの先頭に、ライセンスへのリンクと著作権表示を追加することが推奨されています。例文は https://oss.oracle.com/licenses/upl/ に掲載されています。

vim:
  description: |-
    ソフトウェアの未改変の写しを使用・配布することには制限がありません。ソフトウェアの一部を配布することもできますが、その場合は常にライセンス本文を含めなければなりません。改変版にはいくつかの制限が適用されます。このライセンスは GPL と互換性があり、ソフトウェアを GPL ライブラリとともにコンパイルして配布できます。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。[project] をプロジェクト名に置き換えてください。

wtfpl:
  description: |-
    世の中で最も簡単なライセンスです。利用者があなたのコードで何でも好きなことをできる許可を与えます。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。

zlib:
  description: |-
    GPL と互換性のある短いパーミッシブライセンスです。改変したソースは、改変版であることを明記する必要があります。
  how: |-
    ソースコードのルートにテキストファイル（通常は LICENSE または LICENSE.txt という名前）を作成し、ライセンスの本文をそのファイルにコピーしてください。[year] を現在の年に、[fullname] を著作権者の名前（複数可）に置き換えてください。
