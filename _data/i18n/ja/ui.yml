# --- ホームページ ------------------------------------------------------------
home_intro: |-
  オープンソースライセンスはコントリビューターと利用者を守ります。企業や経験豊富な開発者は、この保護のないプロジェクトには手を出しません。
home_situations_question: "あなたの状況に最も近いのはどれですか？"
home_community_title: "コミュニティの中で活動する必要がある。"
home_community_content: |-
  あなたが貢献している、あるいは依存している[コミュニティで好まれているライセンス](community/)を使いましょう。あなたのプロジェクトはすんなりと溶け込むはずです。

  ライセンスのない依存関係がある場合は、そのメンテナーに[ライセンスを追加する](no-permission/#for-users)よう依頼しましょう。
home_permissive_title: "シンプルで制約の少ないものがいい。"
home_permissive_content: |-
  [MIT License](licenses/mit/) は短く要点を押さえたライセンスです。クローズドソース版を作って配布することも含め、あなたのプロジェクトをほぼ自由に利用できるようにします。
home_copyleft_title: "改良が共有されることを重視する。"
home_copyleft_content: |-
  [GNU GPLv3](licenses/gpl-3.0/) もあなたのプロジェクトをほぼ自由に利用できるようにしますが、クローズドソース版を配布することだけは*例外*です。
home_more_question: "どれも当てはまらない場合は？"
home_nonsoftware_title: "プロジェクトがソフトウェアではない。"
home_nonsoftware_content: |-
  [そのためのライセンスがあります](non-software/)。
home_morechoices_title: "もっと多くの選択肢がほしい。"
home_morechoices_content: |-
  [ほかにもライセンスがあります](licenses/)。
home_nolicense_title: "ライセンスを選びたくない。"
home_nolicense_content: |-
  [選ばなかった場合にどうなるかはこちら](no-permission/)。

# --- ライセンスページ（/licenses/） ------------------------------------------
licenses_intro_html: |-
  オープンソースライセンスは、ソフトウェアの出自と開放性を守るための条件のもとで、ライセンスされたソフトウェアを誰でも、どのような目的でも、使用・改変・共有できるよう許可するものです。以下のライセンスは、条件の多いもの（GNU AGPLv3）から条件のないもの（Unlicense）まで、条件の数の順に並んでいます。<a href="/">ホームページ</a>で紹介している人気のライセンス（GNU GPLv3 と MIT）も、この範囲の中に収まっていることに注目してください。
licenses_appendix_note_html: |-
  choosealicense.com にあるすべてのライセンスの一覧表をお探しの場合は、<a href="/appendix">付録</a>をご覧ください。
licenses_outro_html: |-
  上記のライセンスは、強い保護を与えるものから無条件のものまで、オープンソースライセンスの全範囲を代表しています。新しいオープンソースプロジェクトのほとんどには、このうちのどれかが適しているはずです。上記のライセンスの旧バージョンやよく似た代替ライセンスなど、ほかにも多くのオープンソースライセンスが存在します。さらに詳しく知りたい場合は、<a href="/about/">このサイトについて</a>のページに掲載している資料をご覧ください。

  すでに知識があり、使いたいライセンスが決まっているなら、それで構いません！考えを変えてもらうためにこのサイトがあるわけではありません。でも、選択肢の多さに戸惑っているなら、きっとお役に立てるはずです。

# --- 付録（/appendix/） ------------------------------------------------------
appendix_intro: |-
  参考として、[choosealicense.com リポジトリ](https://github.com/github/choosealicense.com)で説明されているすべてのライセンスの一覧表を掲載します。

  ライセンスを選ぶためにここへ来たのなら、**[ホームページから始めましょう](/)**。ほとんどの場合に適した、いくつかのライセンスを紹介しています。
appendix_col_license: "ライセンス"
appendix_legend_heading: "凡例"
appendix_legend_permissions_html: |-
  オープンソースライセンスは、著作権法やその他の「知的財産」に関する法律によって本来は禁じられている可能性のある行為を、ライセンスされた著作物に対して行うための <span class="license-permissions"><span class="license-marker">✓</span></span> <b>許可</b>を公衆に与えます。
appendix_legend_conditions_html: |-
  ほとんどのオープンソースライセンスによる許可は、<span class="license-conditions"><span class="license-marker">ⓘ</span></span> <b>条件</b>を守ることを前提としています。
appendix_legend_limitations_html: |-
  ほとんどのオープンソースライセンスには、<span class="license-limitations"><span class="license-marker">✕</span></span> <b>制限</b>もあります。通常は保証と責任を否認するもので、特許や商標をライセンスの許諾対象から明示的に除外することもあります。

