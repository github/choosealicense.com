# パッケージマネージャーに関する注記。%id%（SPDX 識別子、<code>）、%languages%（言語へのリンク）、
# %clauses%（任意の括弧書き）は翻訳せずにそのまま埋め込まれます。
# 周囲の文章だけを翻訳します。
sidebar_pkg_html: |-
  該当する場合は、プロジェクトのパッケージ記述に %id%%clauses% を追加してください（例: %languages%）。これにより、パッケージディレクトリにライセンスが表示されるようになります。
sidebar_pkg_only_html: "（将来のバージョンを認めない場合は %id%）"
sidebar_pkg_ofl_html: "（著作権表示の後に予約フォント名を指定する場合は %id%）"
sidebar_gplcc_html: |-
  プロジェクトで GPL-3.0 の是正条項を採用したい場合は、<a href="https://gplcc.github.io/gplcc/">GPL Cooperation Commitment</a> の<a href="https://github.com/gplcc/gplcc/blob/master/Project/COMMITMENT">本文</a>を、%id% のライセンスファイルと同じディレクトリにある <code>COMMITMENT</code> という名前のファイルに追加してください。

