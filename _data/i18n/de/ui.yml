# --- Startseite ----------------------------------------------------------------
home_intro: |-
  Eine Open-Source-Lizenz schützt alle, die an einem Projekt mitarbeiten oder es nutzen. Firmen und erfahrene Entwickler lassen von Projekten ohne diesen Schutz die Finger.
home_situations_question: "Was trifft am ehesten auf dich zu?"
home_community_title: "Ich bin Teil einer Community."
home_community_content: |-
  Nimm die [Lizenz, die in deiner Community üblich ist](community/), also dort, wo du mitarbeitest oder wovon dein Projekt abhängt. Dann passt dein Projekt einfach dazu.

  Falls eine deiner Abhängigkeiten keine Lizenz hat, bitte die Maintainer, [eine hinzuzufügen](no-permission/#for-users).
home_permissive_title: "Es soll einfach und permissiv sein."
home_permissive_content: |-
  Die [MIT-Lizenz](licenses/mit/) ist kurz und kommt direkt auf den Punkt. Andere dürfen mit deinem Projekt so gut wie alles machen, auch Closed-Source-Versionen davon bauen und verbreiten.
home_copyleft_title: "Verbesserungen sollen geteilt werden."
home_copyleft_content: |-
  Auch mit der [GNU GPLv3](licenses/gpl-3.0/) dürfen andere so gut wie alles mit deinem Projekt machen, *nur* keine Closed-Source-Versionen davon verbreiten.
home_more_question: "Und wenn nichts davon passt?"
home_nonsoftware_title: "Mein Projekt ist keine Software."
home_nonsoftware_content: |-
  [Auch dafür gibt es Lizenzen](non-software/).
home_morechoices_title: "Ich hätte gern mehr Auswahl."
home_morechoices_content: |-
  [Hier findest du weitere Lizenzen](licenses/).
home_nolicense_title: "Ich will gar keine Lizenz auswählen."
home_nolicense_content: |-
  [Das passiert, wenn du keine auswählst](no-permission/).

# --- Lizenzübersicht (/licenses/) ----------------------------------------------
licenses_intro_html: |-
  Open-Source-Lizenzen erlauben allen, lizenzierte Software für jeden Zweck zu nutzen, zu verändern und weiterzugeben. Dafür gelten Bedingungen, die sicherstellen, dass die Herkunft der Software erkennbar und die Software offen bleibt. Die folgenden Lizenzen sind nach der Zahl ihrer Bedingungen sortiert: von den meisten (GNU AGPLv3) bis zu gar keinen (Unlicense). Die beiden bekannten Lizenzen von der <a href="/">Startseite</a>, GNU GPLv3 und MIT, liegen irgendwo dazwischen.
licenses_appendix_note_html: |-
  Eine Tabelle mit allen Lizenzen auf choosealicense.com findest du im <a href="/appendix">Anhang</a>.
licenses_outro_html: |-
  Diese Lizenzen decken das ganze Spektrum ab, von sehr schützend bis völlig bedingungslos. Für die meisten neuen Open-Source-Projekte sollte eine davon passen. Es gibt noch viele weitere Open-Source-Lizenzen, etwa ältere Versionen der oben genannten oder Lizenzen, die ihnen sehr ähnlich sind. Wenn du mehr darüber lesen willst, schau dir die Links auf unserer <a href="/about/">Über-uns-Seite</a> an.

  Wenn du dich schon auskennst und eine Lizenz hast, die du gern verwendest: prima! Wir wollen dich nicht umstimmen. Falls dich die vielen Möglichkeiten aber eher erschlagen, können wir dir vielleicht helfen.

# --- Anhang (/appendix/) -------------------------------------------------------
appendix_intro: |-
  Zum Nachschlagen findest du hier eine Tabelle mit allen Lizenzen, die im [choosealicense.com-Repository](https://github.com/github/choosealicense.com) beschrieben sind.

  Wenn du gerade eine Lizenz auswählen willst, **[fang am besten auf der Startseite an](/)**. Dort stehen ein paar Lizenzen, die für die meisten Fälle passen.
appendix_col_license: "Lizenz"
appendix_legend_heading: "Legende"
appendix_legend_permissions_html: |-
  Open-Source-Lizenzen räumen der Allgemeinheit <span class="license-permissions"><span class="license-marker">✓</span></span> <b>Rechte</b> ein, mit den lizenzierten Werken Dinge zu tun, die das Urheberrecht oder andere Gesetze zum sogenannten „geistigen Eigentum“ sonst verbieten würden.
appendix_legend_conditions_html: |-
  Bei den meisten Open-Source-Lizenzen gelten diese Rechte nur, wenn bestimmte <span class="license-conditions"><span class="license-marker">ⓘ</span></span> <b>Bedingungen</b> eingehalten werden.
appendix_legend_limitations_html: |-
  Außerdem haben die meisten Open-Source-Lizenzen <span class="license-limitations"><span class="license-marker">✕</span></span> <b>Einschränkungen</b>. In der Regel schließen sie Gewährleistung und Haftung aus, manchmal nehmen sie auch Patente oder Marken ausdrücklich von den eingeräumten Rechten aus.

